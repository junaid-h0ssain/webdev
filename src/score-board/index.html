<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Score Board</title>
</head>
<body>
    <div class="main-board"> 
        <div class="team team-a">
            <h2>Home</h2>
            <div id="score-a" class="score">0</div>
            <button id="increment-a" class="btn">+1 Point</button>
            <button id="increment-a-2" class="btn">+2 Point</button>
            <button id="increment-a-3" class="btn">+3 Point</button>
        </div>
        <div class="team team-b">
            <h2>Away</h2>
            <div id="score-b" class="score">0</div>
            <button id="increment-b" class="btn">+1 Point</button>
            <button id="increment-b-2" class="btn">+2 Point</button>
            <button id="increment-b-3" class="btn">+3 Point</button>
        </div>

        <div>
            <h2>Team <span id="lead">A</span> is now in lead</h2>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
